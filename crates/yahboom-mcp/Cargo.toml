[package]
name = "rust-yahboom-mcp"
version = "0.1.0"
edition = "2021"
description = "L2 CLI and MCP 2024-11-05 stdio server over yahboom-core"
license = "MIT OR Apache-2.0"

[[bin]]
name = "rust-yahboom-mcp"
